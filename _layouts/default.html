<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Olle Vikström</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL & HOME STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #F9F9F9; color: #000; font-family: 'Inter', sans-serif; padding: 40px; letter-spacing: -0.02em; }
        header { max-width: 1200px; margin: 0 auto 20px auto; }
        h1 { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        nav { display: flex; gap: 25px; margin-bottom: 15px; }
        nav a { text-decoration: none; color: #000; font-size: 0.9rem; transition: opacity 0.3s; }
        nav a:hover { opacity: 0.5; }
        nav a.active { font-weight: 700; text-decoration: underline; }
        .divider { height: 8px; background-color: #000; width: 100%; margin-bottom: 60px; }
        main { max-width: 1200px; margin: 0 auto; padding-left: 25%; }
        .section { margin-bottom: 80px; max-width: 800px; }
        h2 { font-size: 1.1rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #000; padding-bottom: 5px; display: inline-block; }
        
        p { line-height: 1.8; margin-bottom: 20px; font-size: 1.05rem; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 30px; line-height: 1.7; }

        /* --- BIAS TABS --- */
        .tab-nav { display: flex; gap: 40px; border-bottom: 1px solid #ddd; margin-bottom: 40px; }
        .tab-button, .tab-link {
            background: none; border: none; padding: 15px 0;
            font-family: 'Inter', sans-serif; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 0.1em;
            cursor: pointer; opacity: 0.4; transition: 0.3s;
            border-bottom: 3px solid transparent;
            text-decoration: none; color: #000;
        }
        .tab-button.active, .tab-link.active { opacity: 1; font-weight: 700; border-bottom: 3px solid #000; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- AUDIO BLOG (ACCORDION) --- */
        .track-list { list-style: none; padding: 0; }
        .track-list li {
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0;
            display: block; /* Overriding the global LI margin */
        }
        .track-header { display: flex; justify-content: space-between; align-items: center; }
        .details-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.4; }
        .track-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin-top 0.4s;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #555;
        }
        .active-track .track-details { max-height: 400px; margin-top: 15px; }
        .active-track .details-label { opacity: 1; font-weight: 700; }

        /* --- SIGNAL CHAIN --- */
        .signal-chain { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #eee; padding: 20px; margin: 30px 0; border-radius: 4px; }
        .node { text-align: center; flex: 1; }
        .node span.label { display: block; font-size: 0.6rem; text-transform: uppercase; color: #888; margin-bottom: 4px; }
        .node strong { font-size: 0.8rem; }
        .arrow { color: #ccc; padding: 0 10px; }

        /* --- CODE BLOCKS --- */
        pre { background: #f0f0f0; padding: 20px; margin: 20px 0; overflow-x: auto; border-left: 4px solid #000; }
        code { font-family: 'Space Mono', monospace; font-size: 0.85rem; line-height: 1.5; color: #333; }

        /* Mobile Fix */
        @media (max-width: 768px) { 
            main { padding-left: 0; } 
            body { padding: 20px; } 
            .signal-chain { flex-direction: column; gap: 10px; }
            .arrow { transform: rotate(90deg); }
        }
/* --- DISCOGRAPHY GRID  */
.album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 50px 30px;
    margin-top: 40px;
}

.album-item {
    background: #fff; 
    border: 1px solid #eee; 
    padding: 15px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease;
}

.album-item:hover {
    transform: translateY(-5px); 
    border-color: #000;
}

.album-info {
    margin-bottom: 20px;
    min-height: 100px; 
}

.album-item strong {
    display: block;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
}

.album-item p {
    font-size: 0.8rem;
    line-height: 1.5;
    color: #666;
    margin: 0;
}

.album-item iframe {
    border: 0;
    width: 100%;
    height: 380px;
    display: block;
}

@media (max-width: 600px) {
    .album-grid { grid-template-columns: 1fr; }
    .album-item { max-width: 320px; margin: 0 auto; }
}

pre {
    max-width: 90%; /* Keeps it from hitting the edges */
    margin: 20px 0;
    line-height: 1.4;
}

code {
    white-space: pre-wrap; /* Wraps long lines so they don't cause horizontal scrolling */
    word-break: break-all;
}
    </style>
</head>
<body>
    <header>
        <h1>Olle Vikström</h1>
        <nav>
            <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
            <a href="/portfolio.html" {% if page.url == "/portfolio.html" %}class="active"{% endif %}>Portfolio</a>
            <a href="/bio.html" {% if page.url == "/bio.html" %}class="active"{% endif %}>Bio</a>
            <a href="/discography.html" {% if page.url == "/discography.html" %}class="active"{% endif %}>Discography</a>
            <a href="/BIAS.html" {% if page.url == "/BIAS.html" or page.url == "/bias-documentation.html" %}class="active"{% endif %}>BIAS</a>
        </nav>
        <div class="divider"></div>
    </header>
    <main>
        {{ content }}
    </main>
</body>
</html>
