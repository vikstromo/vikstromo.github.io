<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olle Vikström</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #F9F9F9; /* Egg white */
            color: #000;
            font-family: 'Inter', sans-serif;
            padding: 40px;
            letter-spacing: -0.02em; /* Makes it feel more like a designer site */
        }

        /* Top Corner Header */
        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* Navigation Layout */
        nav {
            display: flex;
            gap: 25px;
            margin-bottom: 15px;
        }

        nav a {
            text-decoration: none;
            color: #000;
            font-size: 0.9rem;
            font-weight: 400;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.5;
        }

        nav a.active {
            font-weight: 700;
            text-decoration: underline;
        }

        /* The Thick Border */
        .divider {
            height: 8px; /* Thick border */
            background-color: #000;
            width: 100%;
            margin-bottom: 50px;
        }

        /* Content Area */
        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .section { margin-bottom: 60px; }

        /* Grid for Discography (re-using your Bandcamp logic) */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 40px;
        }

        iframe { border: 0; width: 100%; height: 340px; }

    </style>
</head>
<body>

    <header>
        <h1>Olle Vikström</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="bio.html">Bio</a>
            <a href="discography.html" class="active">Discography</a>
        </nav>
        <div class="divider"></div>
    </header>

    <main>
        <div class="section">
            <h2>Selected Discography</h2>
            <div class="album-grid">
                <div>
                    <iframe src="https://bandcamp.com/EmbeddedPlayer/album=893349693/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/transparent=true/" seamless></iframe>
                    <p style="margin-top:10px;"><strong>Kranen</strong><br>Sing a song fighter</p>
                </div>
                <div>
                    <iframe src="https://bandcamp.com/EmbeddedPlayer/album=369897795/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/transparent=true/" seamless></iframe>
                    <p style="margin-top:10px;"><strong>Tjocka Stenen</strong><br>Brigaden</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
