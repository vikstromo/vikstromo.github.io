<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Olle Vikström</title>
    <style>
        body {
            background-color: #F9F9F9;
            color: #000000;
            font-family: 'Helvetica', sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1, h2 { border-bottom: 1px solid #000; padding-bottom: 10px; }
        nav { margin-bottom: 30px; }
        .player-container {
            background: #fff;
            padding: 20px;
            border: 1px solid #000;
            margin-bottom: 30px;
        }
        audio { width: 100%; filter: grayscale(1); margin-top: 10px; }
        .track-list { list-style: none; padding: 0; }
        .track-list li { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
        }
        .track-list li:hover { background: #f0f0f0; }
        /* Style for the active track */
        .active { background: #ebebeb; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <nav>
         <a href="index.html" style="margin-right: 20px; color: #000; font-weight: bold;">Home</a>
    <a href="portfolio.html" style="color: #000;">Portfolio</a>
         <a href="bio.html" style="color: #000;">Bio</a>
         <a href="discography.html" style="color: #000;">selected discography</a>
        </nav>
    </header>

    <div class="player-container">
        <h3 id="now-playing">Select a track to listen</h3>
        <audio id="audio-player" controls src=""></audio>
    </div>

    <ul class="track-list">
        <li onclick="playAudio('music/demo_260214.mp3', 'BIAS, early demo', this)">
            <strong>Early demo of BIAS</strong> - 260214
        </li>
        <li onclick="playAudio('music/eisler.mp3', 'Brecht/Eisler', this)">
            <strong>Brecht/Eisler</strong> - Arranger/Musician
        </li>
        <li onclick="playAudio('music/01_Ekmans_O.mp3', 'A composition of mine from Tjocka Stenen', this)">
            <strong>Brigaden</strong> - Tjocka Stenen
        </li>
    </ul>

    <script>
        function playAudio(src, title, element) {
            const player = document.getElementById('audio-player');
            const display = document.getElementById('now-playing');
            
            // Update visual "active" state
            const tracks = document.querySelectorAll('.track-list li');
            tracks.forEach(t => t.classList.remove('active'));
            
            // Only add class if 'element' was passed correctly
            if (element) {
                element.classList.add('active');
            }

            // Update text and source
            display.innerText = "Now Playing: " + title;
            player.src = src;
            
            // Force reload and play
            player.load();
            player.play().catch(error => {
                console.log("Autoplay prevented or file error:", error);
            });
        }
    </script>

</body>
</html>
