<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Olle Vikström</title>
    <style>
        body {
            background-color: #F9F9F9; /* Egg white */
            color: #000000;
            font-family: 'Helvetica', sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1, h2 { border-bottom: 1px solid #000; padding-bottom: 10px; }
        nav { margin-bottom: 30px; }
        .player-container {
            background: #fff;
            padding: 20px;
            border: 1px solid #000;
            margin-bottom: 30px;
        }
        audio { width: 100%; filter: grayscale(1); margin-top: 10px; }
        .track-list { list-style: none; padding: 0; }
        .track-list li { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
        }
        .track-list li:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <nav>
            <a href="index.html" style="margin-right: 20px; color: #000;">Home</a>
            <a href="portfolio.html" style="color: #000; font-weight: bold;">Portfolio & Audio</a>
        </nav>
    </header>

    <div class="player-container">
        <h3 id="now-playing">Select a track to listen</h3>
        <audio id="audio-player" controls>
            <source src="" type="audio/mpeg">
        </audio>
    </div>

    <ul class="track-list">
        <li onclick="playAudio('music/demo_260214.mp3', 'Solo Projects - Improvised Music')">
            <strong>Early demo of BIAS</strong> - Sonic storytelling
        </li>
        <li onclick="playAudio('music/eisler.mp3', 'Brecht/Eisler')">
            <strong>Brecht/Eisler</strong> - Arranger/Musician
        </li>
        <li onclick="playAudio('music/01 Ekmans Ö.mp3', 'Brigaden - Upcoming 2026')">
            <strong>Brigaden</strong> - Instrumental from Malmö
        </li>
    </ul>

    <script>
        function playAudio(src, title) {
            const player = document.getElementById('audio-player');
            const display = document.getElementById('now-playing');
            player.src = src;
            display.innerText = "Now Playing: " + title;
            player.play();
        }
    </script>

</body>
</html>
