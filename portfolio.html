<section class="section">
    <h2>Audio Portfolio</h2>
    
    <div class="player-container">
        <h3 id="now-playing" style="font-size: 0.9rem; margin-bottom: 10px;">Select a track to listen</h3>
        <audio id="audio-player" controls src="" style="width: 100%; filter: grayscale(1);"></audio>
    </div>

    <ul class="track-list">
        <li style="border-bottom: none;">
            <a href="/BIAS.html" style="color: #000; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; display: inline-block; text-decoration: none;">
                View the BIAS-system project &rarr;
            </a>
        </li>
        <li onclick="playAudio('music/01_Ekmans_O.mp3', 'Brigaden - Tjocka Stenen', this)" style="padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer;">
            <strong>Brigaden</strong> &mdash; Tjocka Stenen
        </li>
    </ul>
</section>

<script>
    function playAudio(src, title, element) {
        const player = document.getElementById('audio-player');
        const display = document.getElementById('now-playing');
        const tracks = document.querySelectorAll('.track-list li');
        tracks.forEach(t => t.classList.remove('active-track'));
        element.classList.add('active-track');
        display.innerText = "Now Playing: " + title;
        player.src = src;
        player.load();
        player.play().catch(e => console.log("Playback nudge needed"));
    }
</script>
