- title: "Bias demo 260222 04"
  file: "music/demo_04_260222_comp.mp3"
  date: "FEB 2026"
  details: "Sometimes I also want to be a electronics musician. So you can hear from about 7:40 how the sounds change quite a lot and that there is some delay caused by changed delay time. That is me just twisting knobs on my controller. "

- title: "Bias demo 260222 05"
  file: "music/demo_05_260222_comp.mp3"
  date: "FEB 2026"
  details: "From 7 minutes I think this showcase some fun things with the system. I use a combination of  bells, switch and glitch. Bells produce almost like this Miles Davis early fusion era rhodes movement. I think Chick Corea use like a rhodes with a ring modulator on the early records. And then there is switch that just triggers these different white noise sounds through different filters. And glitch is just glitchy, creating strange sounds. "

- title: "Bias demo 260222 03"
  file: "music/demo_03_260222.mp3"
  date: "FEB 2026"
  details: "This uses a synth called percPressure. Which is something close to a physical model of strings inside the piano that you strike with a drum brush. It accumulates energy which can make it quite active if I take a pause. It is a little bit difficult to understand and perhaps not that musical. I think I will try to divide into separate parts later. About 4 minutes in I use a module called perc. It is kind of mix between a bass drum and a metal object. It can make things quite jazzy in a nice way. And if there is some reverb to it can create a more classical electronic vibe."

- title: "Bias demo 260224 01"
  file: "music/demo_01_250424.mp3"
  date: "FEB 2026"
  details: "Here I start with a mood(kind of preset) that I call 'sparse'. It is very fun to play with. I think that if I would play live electronics I would probably produce something like this. Then after a while it moves in to a mood called ambient where I use a 'organ'-synth. That is the only module that actually use my pitch in a audible way. But I think it behaves more like a listening musician than a computer. "

- title: "Bias demo 260214"
  file: "music/demo_260214.mp3"
  date: "FEB 2026"
  details: "Here I tried a routine that just automatically changed what module was being active. There is a sitar-simulation in the beginning that I'm not very fond of. It makes the clarinet behave like a midi-controller for a monophonic synth. "

